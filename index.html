<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabelarea – Valostore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Saira:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --ink:#202020; --muted:#5a5a5a; --tick:#8a8a8a;
  --yellow:#FFCE00; --dyellow:#AD8B00; --line:#AD8B00; --warn:#E81818; --ok:#1EA612;
  --head:#000000; --band:#202020; --chip:#F2F2F2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161616; --surface:#202020; --ink:#F2F2F2; --muted:#b5b5b5; --tick:#7a7a7a;
    --line:#FFCE00; --head:#000000; --band:#2a2a2a; --chip:#2c2c2c; --warn:#ff5a5a;
  }
}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#202020; --ink:#F2F2F2; --muted:#b5b5b5; --tick:#7a7a7a;
  --line:#FFCE00; --head:#000000; --band:#2a2a2a; --chip:#2c2c2c; --warn:#ff5a5a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--head);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(16px,4vw,48px)}
header img{height:30px;width:auto;display:block;max-width:60vw}
.lang{display:flex;flex-wrap:wrap;gap:4px;background:#202020;border-radius:6px;padding:3px}
.lang button{font:600 13px Inter,Helvetica,Arial,sans-serif;color:#F2F2F2;background:transparent;border:0;border-radius:4px;padding:8px 10px;min-width:40px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--yellow);color:#202020}
.band{height:12px;background:var(--band)}
main{max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,48px) 48px}
h1{font-family:Saira,Inter,Helvetica,Arial,sans-serif;font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0 0 8px;text-transform:uppercase;letter-spacing:.01em}
.lead{margin:0 0 24px;font-size:15px;line-height:1.5;max-width:62ch;color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}.panel{order:-1}}
@media (max-width:640px){
  header{padding:14px 16px}header img{height:24px}
  .band{height:6px}
  main{padding-top:16px}
  h1{font-size:24px;margin-bottom:12px}
  .lead{display:none}
  .panel{padding:16px;gap:16px}
  .panel .result{padding:16px 18px}
  .panel .result .big{font-size:44px}
  .settings{gap:8px}
  .seg button{padding:6px 10px;min-height:38px;min-width:56px}
}
.card{background:var(--surface);border-radius:8px}
.chart{padding:8px}
.chart svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.handle{cursor:grab}
.handle:focus{outline:none}
.handle:focus-visible circle.ring{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
svg.dragging .handle{cursor:grabbing}
.panel{padding:24px;display:flex;flex-direction:column;gap:22px}
.result{background:var(--head);color:#FFFFFF;border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.result .lbl{font-size:13px;color:#d0d0d0}
.result .big{font-family:Saira,Inter,Helvetica,Arial,sans-serif;font-weight:800;font-size:56px;line-height:1;color:var(--yellow)}
.result .big small{font-size:24px;margin-left:4px}
.result .sub{font-size:14px;line-height:1.45;color:#F2F2F2}
.result .sub.warn{color:#ffb3b3}
.settings{display:flex;flex-direction:column;gap:10px}
.unitrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.unitrow .k{font-weight:700;font-size:15px}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:6px;padding:3px}
.seg button{font:600 14px Inter,Helvetica,Arial,sans-serif;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:8px 14px;min-height:40px;min-width:64px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#202020;color:#FFCE00}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#FFCE00;color:#202020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#FFCE00;color:#202020}}
.seg button:focus-visible,.lang button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.res-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.result .dia{font-size:12.5px;color:#d0d0d0}
#xsec{width:120px;height:120px;flex-shrink:0;overflow:visible}
#xsec .cab{transition:transform .25s ease}
@media (prefers-reduced-motion: reduce){#xsec .cab{transition:none}}
@media (max-width:640px){#xsec{width:96px;height:96px}}
.step{display:flex;flex-direction:column;gap:6px}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#FFCE00;color:#202020;font:700 12.5px Inter,Helvetica,Arial,sans-serif;margin-right:8px;flex-shrink:0}
.unitrow .k,.field label{display:inline-flex;align-items:center}
.more{border-top:1px solid var(--tick);padding-top:18px;display:flex;flex-direction:column;gap:16px}
.more h2{margin:0;font-family:Saira,Inter,Helvetica,Arial,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:12.5px;line-height:1.45;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.field label{font-weight:700;font-size:15px}
.field output{font-family:Saira,Inter,Helvetica,Arial,sans-serif;font-weight:700;font-size:20px}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--chip);border:1px solid var(--tick)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--chip);border:1px solid var(--tick)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid #202020;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--yellow);border:2px solid #202020}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer;font-size:14px;line-height:1.45}
.toggle input{width:22px;height:22px;accent-color:#AD8B00;margin:1px 0 0;flex-shrink:0}
.toggle strong{display:block;font-size:15px}
.tipbox{background:var(--chip);border-left:4px solid var(--yellow);border-radius:6px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--chip);border-radius:6px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:Saira,Inter,Helvetica,Arial,sans-serif;font-weight:700;font-size:22px;margin-top:2px}
.note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
</style>
</head>

var LOC={sv:'sv-SE',fi:'fi-FI',no:'nb-NO',da:'da-DK',de:'de-DE',en:'en-GB'};

var K=18.4,Lmin=0.8,Lmax=15,Imin=1.8,Imax=250,Y0=716,H=636;

function yL(L){return Y0-mL*Math.log10(L/Lmin)}

function yA(A){return Y0-mA*Math.log10(K*A/(fac()*Lmin*Imin))}

function Ifromy(y){return Imin*Math.pow(10,(Y0-y)/mI)}
function Pmin(){return volt===24?50:25}var Pmax=3000;

function rng(a,b,s){var o=[],n=Math.round((b-a)/s);for(var i=0;i<=n;i++)o.push(+(a+i*s).toFixed(4));return o}
function fmt(v,d){return v.toLocaleString(LOC[lang],{maximumFractionDigits:d==null?2:d})}
function areaStr(a){return fmt(a)+' mm²'}
function awgFor(A){for(var i=0;i<AWG.length;i++){if(AWG[i][1]>=A-1e-9)return AWG[i][0]}return null}

var gStatic;
function drawStatic(){
  if(gStatic)gStatic.remove();
  gStatic=el('g',{});
  var g=gStatic,t=T[lang];
  [[XL,'middle',t.hL,t.uL],[XA,'middle',t.hA,unit==='awg'?'AWG':'mm²'],[XI-10,'end',t.hI,t.uI],[XI+10,'start',t.hP,t.uP.replace('{u}',volt)]].forEach(function(h){
    tx(h[0],30,h[2],h[1],15,700,'Saira','var(--ink)',g);tx(h[0],50,h[3],h[1],11.5,400,'Inter','var(--muted)',g)});
  ln(XL,yL(Lmax),XL,yL(Lmin),1.5,'var(--ink)',g);
  var maj=[1,1.5,2,3,4,5,6,8,10,12,15];

  var mi=[2,3,4,5,6,8,10,15,20,30,40,50,60,80,100,150,200,250];

  var P=[25,30,40,50,60,80,100,150,200,300,400,500,600,800,1000,1500,2000,2500,3000];
  var pm=[];for(var p=25;p<100;p+=5)pm.push(p);for(p=100;p<300;p+=10)pm.push(p);for(p=300;p<1000;p+=50)pm.push(p);for(p=1000;p<3000;p+=100)pm.push(p);
  function okP(p){var i=p/volt;return i>=Imin-1e-9&&i<=Imax+1e-9}
  pm.forEach(function(p){if(P.indexOf(p)<0&&okP(p))ln(XI,yI(p/volt),XI+5,yI(p/volt),1,'var(--tick)',g)});
  P.forEach(function(p){if(!okP(p))return;ln(XI,yI(p/volt),XI+12,yI(p/volt),1.5,'var(--ink)',g);tx(XI+18,yI(p/volt),fmt(p),'start',13,500,null,null,g)});
  function vis(a){var y=yA(a);return y>=86&&y<=Y0}
  var shown=(unit==='awg'?AWG.map(function(a){return a[1]}):STD).filter(vis);

    AWG.forEach(function(a){if(vis(a[1])&&AWG_LABELS.indexOf(a[0])<0)ln(XA-5,yA(a[1]),XA+5,yA(a[1]),1,'var(--tick)',g)});
    AWG.forEach(function(a){if(vis(a[1])&&AWG_LABELS.indexOf(a[0])>=0){ln(XA-10,yA(a[1]),XA+10,yA(a[1]),1.5,'var(--ink)',g);tx(XA-16,yA(a[1]),a[0],'end',13,600,null,null,g)}});
  }else{
    STD.forEach(function(v){if(!vis(v))return;ln(XA-10,yA(v),XA+10,yA(v),1.5,'var(--ink)',g);tx(XA-16,yA(v),fmt(v),'end',13,600,null,null,g)});
  }

  svg.setAttribute('aria-label',t.aria.replace('12 V',volt+' V'));
}
var gDyn=el('g',{});
var lineEl=el('line',{'stroke-width':3,'stroke-linecap':'round',style:'stroke:var(--line)'},gDyn);
var aDot=el('circle',{r:6,'stroke-width':1.5,style:'stroke:#202020'},gDyn);
var aTag=el('g',{},gDyn);
var aTagBg=el('rect',{rx:4,height:24,style:'fill:#202020'},aTag);
var aTagTx=el('text',{'font-size':13,'font-weight':700,'dominant-baseline':'middle',style:'fill:#FFCE00;font-family:Inter,Helvetica,Arial,sans-serif'},aTag);
function mkHandle(x){
  var g=el('g',{class:'handle',tabindex:'0',role:'slider','aria-valuemin':'0','aria-valuemax':'1000'},gDyn);
  el('circle',{r:22,style:'fill:transparent'},g);
  el('circle',{class:'ring',r:13,style:'fill:transparent;stroke:transparent'},g);
  el('circle',{r:9,'stroke-width':2,style:'fill:#FFCE00;stroke:#202020'},g);
  return g}
var hL=mkHandle(XL),hP=mkHandle(XI);
var xs=document.getElementById('xsec');
function drawX(Aeach,n,over){
  while(xs.firstChild)xs.removeChild(xs.firstChild);
  var k=11.28,R=Math.sqrt(4*Math.min(Aeach,53.5)/Math.PI)/2*k,ins=Math.max(3,R*0.24),Rt=R+ins;
  var cx=n===2?[30,90]:[60],sc=n===2?Math.min(1,28/Rt):Math.min(1,58/Rt);
  var core=mat==='al'?'#B9C0C7':'#C8763A',coreHi=mat==='al'?'#E3E7EA':'#E9A46A',coreLo=mat==='al'?'#7E868D':'#8A4A1E';
  var rings=Aeach<1?1:Aeach<4?2:Aeach<16?3:4,sr=R/(2*rings+1);
  cx.forEach(function(x){
    var g=el('g',{class:'cab',transform:'translate('+x+',60) scale('+sc+')'},xs);
    el('circle',{r:Rt,style:'fill:'+(over?'#E81818':'#D22B2B')},g);
    el('circle',{r:Rt,style:'fill:none;stroke:rgba(255,255,255,.18);stroke-width:1'},g);
    el('circle',{r:R+0.6,style:'fill:'+coreLo},g);
    for(var q=-rings;q<=rings;q++)for(var r=-rings;r<=rings;r++){
      var s3=-q-r;if(Math.abs(s3)>rings)continue;
      var px=sr*2*(q+r/2),py=sr*Math.sqrt(3)*r;
      el('circle',{cx:px,cy:py,r:sr*0.96,style:'fill:'+core+';stroke:'+coreLo+';stroke-width:'+(sr*0.12)},g);
      el('circle',{cx:px-sr*0.3,cy:py-sr*0.3,r:sr*0.32,style:'fill:'+coreHi+';opacity:.7'},g);
    }
    if(over){var t=el('text',{x:0,y:2,'text-anchor':'middle','dominant-baseline':'middle','font-size':R*0.9,'font-weight':800,style:'fill:#FFFFFF;font-family:Inter,Helvetica,Arial,sans-serif'},g);t.textContent='!'}
  });
}


var state={L:4,P:27,par:false};
try{var st=JSON.parse(localStorage.getItem('vs-kabel-state')||'null');if(st&&st.L&&st.P){state.L=st.L;state.P=st.P;state.par=!!st.par}}catch(e){}

var len=document.getElementById('len'),pow=document.getElementById('pow'),par=document.getElementById('par');
function L2s(L){return Math.round(1000*Math.log(L/Lmin)/Math.log(Lmax/Lmin))}
function s2L(s){return Lmin*Math.pow(Lmax/Lmin,s/1000)}
function P2s(P){return Math.round(1000*Math.log(P/Pmin())/Math.log(Pmax/Pmin()))}
function s2P(s){return Pmin()*Math.pow(Pmax/Pmin(),s/1000)}
function roundL(L){return L<3?Math.round(L*10)/10:(L<10?Math.round(L*4)/4:Math.round(L*2)/2)}
function roundP(P){return P<100?Math.round(P):(P<1000?Math.round(P/5)*5:Math.round(P/10)*10)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function update(){
  var t=T[lang],L=state.L,P=state.P,I=P/volt,Ic=state.par?I/2:I,A=Ic*L*fac()/K,awg=unit==='awg';
  var y1=yL(L),y2=yI(clamp(Ic,Imin,Imax)),dx=XI-XL,dy=y2-y1,e=0.07;
  lineEl.setAttribute('x1',XL-dx*e);lineEl.setAttribute('y1',y1-dy*e);lineEl.setAttribute('x2',XI+dx*e);lineEl.setAttribute('y2',y2+dy*e);
  var ya=(y1*(XI-XA)+y2*(XA-XL))/(XI-XL),over=A>maxArea();
  aDot.setAttribute('cx',XA);aDot.setAttribute('cy',ya);aDot.style.fill=over?'var(--warn)':'#FFCE00';
  hL.setAttribute('transform','translate('+XL+','+y1+')');
  hP.setAttribute('transform','translate('+XI+','+y2+')');
  var rec=over?null:(awg?'AWG '+awgFor(A):areaStr(STD.find(function(s){return s>=A-1e-9})));
  aTagTx.textContent=awg?(over?'> AWG 1/0':'AWG '+awgFor(A)):fmt(A,A<10?2:1)+' mm²';
  var w=aTagTx.getComputedTextLength?aTagTx.getComputedTextLength()+16:80;
  aTagBg.setAttribute('width',w);aTagBg.setAttribute('x',XA+14);aTagBg.setAttribute('y',ya-12);
  aTagTx.setAttribute('x',XA+22);aTagTx.setAttribute('y',ya+1);
  aTagBg.style.fill=over?'var(--warn)':'#202020';aTagTx.style.fill=over?'#FFFFFF':'#FFCE00';
  hL.setAttribute('aria-valuenow',L2s(L));hP.setAttribute('aria-valuenow',P2s(P));
  hL.setAttribute('aria-valuetext',fmt(L,2)+' m');hP.setAttribute('aria-valuetext',fmt(P,0)+' W');
  hL.setAttribute('aria-label',t.hLen);hP.setAttribute('aria-label',t.hPow);
  len.value=L2s(L);pow.value=P2s(P);par.checked=state.par;
  len.setAttribute('aria-valuetext',fmt(L,2)+' m');pow.setAttribute('aria-valuetext',fmt(P,0)+' W');
  document.getElementById('lenOut').textContent=fmt(L,2)+' m';
  document.getElementById('powOut').textContent=fmt(P,0)+' W';
  var lbl=document.getElementById('resLbl'),big=document.getElementById('resArea'),bu=document.getElementById('resUnit'),sub=document.getElementById('resSub');
  var mStr=awg?'AWG 1/0':'50 mm²';
  var need=areaStr(+A.toFixed(A<10?2:1)),pre=state.par?'2 × ':'';
  if(over){
    lbl.textContent=state.par?t.resLbl2:t.resLbl1;
    big.textContent=awg?'>1/0':fmt(A,A<10?2:1);bu.textContent=awg?'AWG':'mm²';
    sub.textContent=(state.par?t.over:t.overTip).replace('{m}',mStr)+(awg?' '+t.calc.replace('{a}',need):'');sub.className='sub warn';
  }else{
    lbl.textContent=state.par?t.pick2:t.pick;
    big.textContent=pre+(awg?awgFor(A):fmt(STD.find(function(x){return x>=A-1e-9})));bu.textContent=awg?'AWG':'mm²';
    sub.textContent=(state.par?t.calcUp2:t.calcUp).replace('{a}',need);sub.className='sub';
  }
  var Ad=over?maxArea():(awg?AWG.find(function(a){return a[0]===awgFor(A)})[1]:STD.find(function(x){return x>=A-1e-9}));
  drawX(Ad,state.par?2:1,over);
  xs.setAttribute('aria-label',t.xsec+': '+(state.par?'2 × ':'')+fmt(Ad)+' mm²');
  document.getElementById('resDia').textContent=over?'':t.dia.replace('{d}',fmt(Math.sqrt(4*Ad/Math.PI),1))+(state.par?' (× 2)':'');
  document.getElementById('stCur').textContent=fmt(I,I<10?2:1)+' A';
  document.getElementById('stPer').textContent=fmt(Ic,Ic<10?2:1)+' A';
  var need=I*1.25,RL=[20,30,40,70,100,150,200],rl=RL.find(function(x){return x>=need-1e-9});
  document.getElementById('stRelay').textContent=rl?rl+' A':'> 200 A';
  try{localStorage.setItem('vs-kabel-state',JSON.stringify(state))}catch(e){}
}
function applyAll(){
  var t=T[lang];document.documentElement.lang=lang==='no'?'nb':lang;document.title=t.docTitle;
  document.querySelectorAll('[data-t]').forEach(function(n){n.textContent=t[n.getAttribute('data-t')].replace('{u}',volt)});
  state.P=clamp(state.P,Pmin(),Pmax);
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false')});
  var cur={unit:unit,volt:String(volt),mat:mat};
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',cur[b.getAttribute('data-key')]===b.getAttribute('data-val')?'true':'false')});
  drawStatic();update();
  try{localStorage.setItem('vs-kabel-lang',lang);localStorage.setItem('vs-kabel-unit',unit);localStorage.setItem('vs-kabel-volt',String(volt));localStorage.setItem('vs-kabel-mat',mat)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.getAttribute('data-lang');applyAll()})});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-key'),v=b.getAttribute('data-val');if(k==='unit')unit=v;else if(k==='volt')volt=+v;else mat=v;applyAll()})});
len.addEventListener('input',function(){state.L=roundL(s2L(+len.value));update()});
pow.addEventListener('input',function(){state.P=roundP(s2P(+pow.value));update()});
par.addEventListener('change',function(){state.par=par.checked;update()});

function svgY(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
var drag=null;
function startDrag(which,ev){drag=which;svg.classList.add('dragging');try{svg.setPointerCapture(ev.pointerId)}catch(e){}moveDrag(ev);ev.preventDefault()}
function moveDrag(ev){
  if(!drag)return;var y=svgY(ev).y;
  if(drag==='L'){state.L=roundL(clamp(Lfromy(y),Lmin,Lmax))}
  else{var Ic=clamp(Ifromy(y),Imin,Imax),P=Ic*volt*(state.par?2:1);state.P=roundP(clamp(P,Pmin(),Pmax))}
  update()}
svg.addEventListener('pointerdown',function(e){
  var q=svgY(e);if(q.y<70||q.y>Y0+14)return;
  if(Math.abs(q.x-XL)<44)startDrag('L',e);else if(Math.abs(q.x-XI)<44)startDrag('P',e)});
svg.addEventListener('pointermove',moveDrag);
function end(){drag=null;svg.classList.remove('dragging')}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
function key(which,e){
  var d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:10,PageDown:-10}[e.key];if(!d)return;e.preventDefault();
  for(var k=1;k<=12;k++){
    if(which==='L'){var nL=roundL(s2L(clamp(L2s(state.L)+d*10*k,0,1000)));if(nL!==state.L){state.L=nL;break}}
    else{var nP=roundP(s2P(clamp(P2s(state.P)+d*10*k,0,1000)));if(nP!==state.P){state.P=nP;break}}
  }
  update()}
hL.addEventListener('keydown',function(e){key('L',e)});hP.addEventListener('keydown',function(e){key('P',e)});

applyAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(update);
})();
</script>
